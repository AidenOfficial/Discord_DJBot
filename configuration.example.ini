# ========================================================
#  Discord-DJBot example configuration file
#  Version 1
# ========================================================
#  Rename this file to configuration.ini after editing.
#  Uncomment lines you'd like to change, and carefully
#  follow the instructions.
# ========================================================

# The [discord] section tells the bot how to log in to Discord.
# This section will be overridden by command line arguments.
[discord]
# 'token': 机器人的 token(Discord Developer Portal → 你的应用 → Bot → Reset Token)。
#    也可以不写在这里,改用环境变量 DISCORD_TOKEN(Docker 部署推荐,见 deploy/DOCKER.md)。
#    token 等同于账号密码,不要提交到 Git、不要发给别人。
#token =
# 'guild_id': bot 服务的 Discord 服务器 ID(开发者模式下右键服务器图标 → 复制服务器 ID)。
#    留空 = 用 bot 加入的第一个服务器。现在是单服务器模式:其他服务器里的命令会被拒绝。
#guild_id =
# 'channel': 启动时自动进入的语音频道:频道 ID,或 "分类名/频道名"(不在分类里的频道直接写频道名)。
#    留空 = 启动后不进频道,等有人 /play 或 /join。在 Web UI 的 Settings 页设置过默认频道后,
#    以 Web 上的设置为准;跟随模式也在那里配置。
#channel =
# 'announce_channel': "正在播放""下载完成"这类公告发到哪个文字频道(频道 ID)。
#    留空 = 发到最近一次有人用命令的频道。
#announce_channel =
# 'admin_by_permission': 服务器里有"管理员"或"管理服务器"权限的人自动算 bot 管理员。
#admin_by_permission = True
# 'self_deaf': 进语音频道时自己设为"耳机静音"(bot 不需要听别人说话)。
#self_deaf = True
# 'bitrate': 发送码率(kbps)。0 = 跟随语音频道的码率设置(64 起,最高 384)。
#bitrate = 0
# 'now_playing_panel': 在公告频道放一条"正在播放"面板(封面、歌名 / 歌手 / 专辑、进度条、控制按钮),
#    换歌时更新同一条消息;面板被聊天顶上去了才删掉重发到最底下。打开时 [bot] announce_current_music
#    的文字公告不再发送。bot 需要在公告频道有"嵌入链接""附加文件""读取消息历史"权限。
#now_playing_panel = True
# 'voice_channel_status': 把"🎵 歌名 — 歌手"写进 bot 所在语音频道的频道状态(频道列表里频道名下面那行)。
#    需要"设置语音频道状态"权限(README 里的邀请链接已包含;老的邀请要重新授权一次)。
#voice_channel_status = True

# The [bot] section stores some basic settings for the bot.
[bot]
# 'language': Language of the bot's chat messages: en_US, zh_CN or ja_JP.
#language=en_US

# 'music_folder': Folder that stores your local songs.
#music_folder = music_folder/

# 'database_path': The path of the database, which stores things like your
#    volume set by the /volume command, your playback mode and your playlist,
#    banned URLs, etc.
#    This option will be overridden by command line arguments.
# 'music_database_path': The path of the database that stores the music library.
#    Can be disabled by setting 'save_music_library = False'
#database_path=settings.db
#music_database_path=music.db

# 'admin': bot 管理员:Discord 用户 ID 或身份组 ID,用 ',' 或 ';' 分隔。
#    (开发者模式下右键用户 / 身份组 → 复制 ID。)另见 [discord] admin_by_permission。
#admin = 123456789012345678;234567890123456789

# 'volume': The default volume, a number from 0 to 1.
#    This option will be overridden by the value set in the database.
#volume = 0.1

# 'playback_mode': The playback mode of the bot. It should be one of the below:
#     one-shot: remove item once it has finished playing
#     repeat: repeat the playlist
#     single: loop the current track (a skip moves on to the next one)
#     random: randomize the order of the playlist
#     autoplay: randomly pick a track from the music library
#    This option will be overridden by the value set in the database.
# 'autoplay_length': How many songs to fill the playlist with in autoplay mode.
# 'clear_when_stop_in_oneshot': Whether to clear the playlist when stopping the
#    bot in one-shot mode.
#playback_mode = one-shot
#autoplay_length = 5
#clear_when_stop_in_oneshot = False

# 'tmp_folder': Folder that music will be downloaded into (the download cache).
#    Docker 部署时由 docker-compose 的 BAM_TMP_FOLDER 环境变量覆盖为挂载目录
#    /botamusique/cache/,容器重建缓存也不丢。
# 'tmp_folder_max_size': 下载缓存上限(MB)。超出时按"最久没用"淘汰(LRU),
#    固定(pin)、正在播放队列里、下载中的条目不会被淘汰。0 = 不保留缓存,
#    -1 = 不限。Web UI 的 Cache 页可以查看、固定、手动释放。
# 'cache_auto_keep_plays': 播放次数达到这个数的条目算"常听",按天数过期的
#    定期清理会跳过它们,容量超限时也最后才淘汰。0 = 关闭。
# 'ignored_files', 'ignored_folders': Files and folders to ignore during scanning.
#tmp_folder = /tmp/
#tmp_folder_max_size = 4096
#cache_auto_keep_plays = 3

# 'cleanup_interval_days': Sweep downloaded audio caches (tmp_folder and the
#    Spotify download_folder) every N days, or 0 to disable the periodic sweep.
#    The last run time survives restarts (stored in the settings database).
# 'cleanup_keep_days': During a sweep, keep cached files played or downloaded
#    within the last N days (pinned and frequently played items are always kept). Files referenced by the current queue or still downloading
#    are always kept; the local music_folder is never touched.
#cleanup_interval_days = 7
#cleanup_keep_days = 7

# 'stream_while_downloading': Start playing long URL downloads before they
#    finish, once enough audio is buffered on disk (on by default, so multi-hour
#    videos start within seconds). If a container cannot be decoded while still
#    growing, the bot automatically falls back to waiting for the full download.
# 'stream_buffer_seconds': How many seconds of audio must be on disk beyond
#    the current playhead before (re)starting playback of a growing file.
# 'stream_min_duration': Only items longer than this many seconds use
#    stream-while-downloading; short downloads finish quickly anyway.
#stream_while_downloading = True
#stream_buffer_seconds = 30
#stream_min_duration = 300

# 'artwork_lookup': 按视频标题去网易云 / iTunes / Deezer 找正式发行的专辑封面,
#    找不到或不能确定是同一首歌时用视频封面。只发送解析出的歌名/歌手做搜索。
#    关掉后只用视频封面(仍然是高清的)。
# 'artwork_itunes_country': iTunes 搜索用的地区商店(歌名/歌手名会按地区本地化)。
# 'artwork_folder': 高清封面存放目录,留空 = settings 数据库所在目录下的 artwork/。
# 'artwork_folder_max_size': 高清封面目录上限(MB),超出时删最旧的,用到时重新获取。
# 'artwork_youtube_music': 读 YouTube 视频简介里的「Music」卡片(Content ID 认出的歌名/歌手),
#    校验过再拿去查曲库。会向 YouTube 多发一次请求(只发视频 ID)。
# 'artwork_shazam': 标题和曲库都对不上时,从下载好的音频里截 12 秒交给 Shazam 识别
#    (只上传本地算出的音频指纹,不上传音频)。非官方接口,可能随时失效;
#    标题写明翻唱/现场/合集的不识别。需要 shazamio-core(requirements.txt 里有)和 ffmpeg。
# 'artwork_shazam_language': Shazam 返回的歌名/歌手按这个语言本地化。zh-CN 下欧美歌手保留英文名、
#    日本歌手是汉字名;ja-JP 会把欧美歌手名翻成片假名。
#artwork_lookup = True
#artwork_youtube_music = True
#artwork_shazam = True
#artwork_shazam_language = zh-CN
#artwork_itunes_country = JP
#artwork_folder =
#artwork_folder_max_size = 512

# 'lyrics_lookup': 歌词(默认关闭)。按 artwork 认出的歌名/歌手先查 LRCLIB(lrclib.net,免费、不用 key),
#    查不到再查网易云(带中文翻译)。认不出是哪首歌的视频不查,所以需要 artwork_lookup 开着。
#    网页播放页显示跟随进度滚动的歌词,聊天里用 /lyrics 发整首。MV 和原曲时长对不上时,
#    开着 artwork_shazam 会截一段认歌来对时间轴;对不上就只列出歌词,网页上可以手动调偏移。
# 'lyrics_sources': 按顺序查哪些来源,逗号分隔(lrclib / netease)。LRCLIB 是社区上传的,中文歌多为繁体、
#    少数条目质量一般;网易云中日文歌更全、带中文翻译。主要听中日文歌可以改成 netease,lrclib。
# 'lyrics_folder': 歌词缓存目录,留空 = settings 数据库所在目录下的 lyrics/。
#lyrics_lookup = False
#lyrics_sources = lrclib,netease
#lyrics_folder =

# 'sponsorblock': 播放 YouTube / B 站视频时跳过社区标注的非音乐片段(MV 片头片尾的说话、
#    赞助口播等)。数据来自 sponsor.ajay.app 和 bsbsb.top,只发视频 ID 哈希的前 4 位。
#    不改动下载文件,播放到片段时直接跳到片段结尾;片段一直到曲尾就切下一首。
# 'sponsorblock_categories': 要跳过的类别,逗号分隔。可选 music_offtopic(MV 里的非音乐部分)、
#    sponsor、selfpromo、interaction、intro、outro、preview、filler。intro/outro 可能会切到音乐,默认不开。
#sponsorblock = True
#sponsorblock_categories = music_offtopic,sponsor,selfpromo,interaction

# 'prefetch_count': While a song plays, pre-download up to this many upcoming
#    queue items (at most 2 downloads run concurrently). 1 keeps the old
#    behavior of only pre-downloading the immediate next item.
#prefetch_count = 2
#ignored_folders = tmp
#ignored_files = Thumbs.db

# 'download_attempts': How many times to attempt a download.
#download_attempts = 2

# 'logfile': File to write log messages to.
# 'redirect_stderr': Whether to capture outputs from standard error and write
#    it into the log file. Useful for capturing an exception message when the
#    bot crashes.
#logfile =
#redirect_stderr = False

# 'announce_current_music': 每首歌开始时在公告频道发 "正在播放"。
# 'allow_other_channel_message': 不在 bot 所在语音频道的人也能控制播放(默认只有同频道的人能)。
#announce_current_music = True
#allow_other_channel_message = False

# 'delete_allowed': Whether to allow admins to delete a file from the library
#    stored on disk. Works for both command and web interfaces.
#delete_allowed = True

# 'save_music_library': Whether to save music metadata to the database.
#save_music_library = True

# 'refresh_cache_on_startup': Whether to refresh the music directory's cache when
#    starting up. Metadata from each file will not be refreshed. If this is False,
#    the cache from last time will be used.
#refresh_cache_on_startup = True

# 'save_playlist': Whether to save the current playlist before quitting, so that
#    it may be reloaded next time. To use this, save_music_library must be True.
#save_playlist = True

# 'max_volume': Maximum volume users are allowed to set.
#    Number between 0.0 - 1.0.
#max_volume = 0.8

# 'max_track_playlist': The maximum amount of tracks allowed in a playlist.
#max_track_playlist = 20

# 'max_track_duration': Maximum track duration in minutes (0 = no limit, the default).
#    设了上限时,管理员可以用 /urlwhitelist 给个别链接开例外。
#max_track_duration = 0

# 'when_nobody_in_channel': Behaviour of the bot when nobody is in the channel.
#    Has to be one of:
#     pause: pause the current track
#     pause_resume: pause the current track and resume it once someone joins
#     stop: stop the bot, clearing its playlist
#    Or you can leave it empty to take no action.
#when_nobody_in_channel =

# 'when_nobody_in_channel_ignore': List of users that should be ignored.
#    This is typically used when other bots are present in the channel.
#when_nobody_in_channel_ignore =

# 'youtube_query_cookie': Sometimes YouTube will block the bot's request and ask
#    the bot to complete a captcha to verify the request is made by a human. This
#    can be solved if the bot has a valid cookie. If the bot complains "unable to
#    query youtube", you should provide a value here.
#youtube_query_cookie = {"CONSENT": "paste your CONSENT cookie value here"}

# The [webinterface] section stores settings related to the web interface.
[webinterface]
# 'enabled': Whether to enable the web interface to allow managing your playlist,
#    uploading tracks, etc.
#    The web interface is disabled by default for security and performance reasons.
# 'access_address': URL provided to users when the public URL for the
#    web interface is requested.
#enabled = False
#listening_addr = 127.0.0.1
#listening_port = 8181
#is_web_proxified = True
#access_address = http://127.0.0.1:8181

# 'web_logfile': If this is provided, web server access logs are written to this file.
#web_logfile =

# 'log_viewers': 谁能在设置页 → 日志里查看 bot 日志、开关调试日志。逗号分隔的
#    Access 邮箱(或 user:<Web 用户名>)。留空 = 所有能打开 Web UI 的人都能看。
#    日志历史写在 settings 库旁边的 logs/ 目录(Docker 里即 data/logs/)。
#log_viewers = you@example.com

# 'auth_method': Method used to authenticate users accessing the web interface.
#    One of 'none', 'password', 'token' or 'discord'. If this is set to 'token', a unique token
#    is used for authentication. 'discord' requires "Log in with Discord" (see below) and
#    only lets in Discord accounts that are in a server the bot serves.
# 'max_attempts': Amount of incorrect login attempts needed before being banned.
#    Regenerating a token or rebooting the bot will reset this number.
#auth_method = token
#max_attempts = 10

# 'user', 'password': If auth_method is set to 'password', you'll need to set
#    the default username and password, which is set by these two options.
#    You can add more users using the '/webuseradd' command.
#user = djbot
#password = ChangeThisPassword

# 'flask_secret': To use a token, Flask needs a password to encrypt/sign cookies.
#    This is absolutely necessary if auth_method is 'token'!
#    If unset or left at the default below, a random secret is generated once and kept in
#    the settings database, so web sessions survive restarts.
#flask_secret = ChangeThisPassword

# "Log in with Discord" (OAuth2). In the Discord Developer Portal → your application →
#    OAuth2, add the redirect <public_url>/auth/discord/callback, then copy the client ID
#    and client secret here. With both set, the token page shows a "Log in with Discord"
#    button; set auth_method = discord to require it.
# 'discord_client_secret': Never commit it. You can leave it empty here and set the
#    DISCORD_CLIENT_SECRET environment variable instead (it takes precedence).
# 'public_url': The address users open the web interface at, e.g. https://music.example.com
#    (no trailing slash). The redirect URI is built from it and must match the portal exactly.
#    If empty, the address of the current request is used.
#discord_client_id =
#discord_client_secret =
#public_url =

# 'upload_enabled': Whether to enable the upload function of the web interface.
#    If this is False, only admins can upload files.
# 'maximum_upload_file_size': Maximum file size allowed for uploads.
#    Can be specified in B, KB, MB, GB, or TB.
#upload_enabled = True
#max_upload_file_size = 4G
# 'upload_extract_audio': 上传的视频只保留音轨(ffmpeg 流复制成 .mka,不重编码),
#    几 GB 的视频通常只剩几十到几百 MB。Web UI 的上传走分片(每片 32MB),
#    不受 Cloudflare 单请求 100MB 的限制,断网可续传。
#upload_extract_audio = True

# Cloudflare Access 身份(Web UI 的别名与个人歌单依赖它):
# 'access_email_header': Access 回源时携带登录邮箱的请求头,默认即可。
#    留空则不读取。仅当 8181 端口没有直接暴露、只能经 Tunnel 访问时,这个头才可信。
# 'access_team_domain' + 'access_aud': 都填上则改为校验 Cf-Access-Jwt-Assertion
#    JWT(更安全,伪造请求头无效;没有合法 JWT 的请求一律 403)。
#    team domain 形如 yourteam.cloudflareaccess.com;AUD 在 Access 应用的
#    Overview 页面里("Application Audience (AUD) Tag")。
#access_email_header = Cf-Access-Authenticated-User-Email
#access_team_domain =
#access_aud =

# The [debug] section contains settings to enable debugging messaages.
[debug]
# 'ffmpeg': Whether to display debug messages from ffmpeg.
# 'discord_connection': Whether to display debug messages from discord.py.
# 'youtube_dl': Whether to display debug messages from youtube-dl.
#ffmpeg = False
#discord_connection = False
#youtube_dl = False

# The [radio] section contains a list of default radio stations.
[radio]
# List of radio stations you want to have by default, one entry per line.
#jazz = http://jazz-wr04.ice.infomaniak.ch/jazz-wr04-128.mp3 "Jazz Yeah !"

# The optional [youtube_dl] section contains options to customize youtube-dl
[youtube_dl]
# 'source_address': Set to '::' to force ipv6, "0.0.0.0" to force ipv4,
#    or else put the IP address you want to use here.
# 'cookie_file': Path of the cookie file to use, useful if you are being rate limited:
#    <https://github.com/ytdl-org/youtube-dl#http-error-429-too-many-requests-or-402-payment-required>
# 'user_agent': Set the User-Agent header when making requests to youtube.com.
# source_address = '::'
# cookie_file = /tmp/youtube-dl-cookie
# user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:87.0) Gecko/20100101 Firefox/87.0"

# The [commands] section renames slash commands. Values are the slash command
# name (1-32 lowercase letters, digits, '-' or '_'). For the full list see
# configuration.default.ini; copy only the ones you want to change.
[commands]
#play_file = file
#add_from_shortlist = pick
